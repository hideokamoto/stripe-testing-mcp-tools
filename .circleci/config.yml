version: 2.1

# Node.js orb handles the toolchain install + dependency caching for us,
# so individual jobs don't need to hand-roll pnpm cache keys.
orbs:
  node: circleci/node@5.3.0

# Single executor reused by every job. The tag is pinned so CI matches the
# runtime the project targets locally.
executors:
  node:
    docker:
      - image: cimg/node:22.22

jobs:
  lint:
    executor: node
    steps:
      - checkout
      # pnpm is not on the image by default; corepack provides the version pinned
      # by `packageManager` in package.json.
      - run:
          name: Enable pnpm (corepack)
          command: sudo corepack enable && corepack install
          environment:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # node/install-packages runs `pnpm install --frozen-lockfile` and
      # restores/saves node_modules keyed off pnpm-lock.yaml.
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Lint (prettier --check)
          command: pnpm run lint

  typecheck:
    executor: node
    steps:
      - checkout
      - run:
          name: Enable pnpm (corepack)
          command: sudo corepack enable && corepack install
          environment:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Type check
          command: pnpm run typecheck

  build:
    executor: node
    steps:
      - checkout
      - run:
          name: Enable pnpm (corepack)
          command: sudo corepack enable && corepack install
          environment:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Build
          command: pnpm run build

  test:
    executor: node
    # CircleCI Smarter Testing drives the run via `circleci run testsuite`
    # (see .circleci/test-suites.yml). It performs test impact analysis to skip
    # tests unaffected by the change, dynamically splits the selected tests
    # across these parallel containers, and reruns only failed tests.
    parallelism: 2
    steps:
      - checkout
      - run:
          name: Enable pnpm (corepack)
          command: sudo corepack enable && corepack install
          environment:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Smarter Testing (impact analysis + dynamic split + rerun)
          command: circleci run testsuite "ci tests"
      # JUnit results (path matches outputs.junit in test-suites.yml) feed the
      # impact/timing models and the test insights UI.
      - store_test_results:
          path: test-results

  # The landing page (site/) is a separate pnpm + Astro project with its own
  # lockfile, so it doesn't reuse the root install. We activate pnpm via corepack
  # and run the site's own type-check / test / build. (A pnpm store cache can
  # be layered on later if this job gets slow.)
  site:
    executor: node
    working_directory: ~/project/site
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Enable pnpm (corepack)
          command: sudo corepack enable && corepack prepare pnpm@10 --activate
      - run:
          name: Install dependencies (pnpm)
          command: pnpm install --frozen-lockfile
      - run:
          name: Type check (astro check)
          command: pnpm run typecheck
      - run:
          name: Test (vitest)
          command: pnpm run test
      - run:
          name: Build (Astro)
          command: pnpm run build

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - build
      - test
      - site
