version: 2
# CI runs on CircleCI (see .circleci/config.yml), so there are no GitHub
# Actions workflows to update here. CircleCI orb bumps aren't supported by
# Dependabot and are handled manually.
#
# main への push で release と Docs/LP Deploy が走るので、ボット PR を 1 本ずつ
# マージせずに済むよう、ディレクトリごとに実行時依存と開発用依存でまとめる。
# 実行時依存のメジャー（zod 4、astro 7 など）は利用者に見える変化があり判断が要るので、
# グループに入れず個別の PR のままにする。開発用依存はメジャーも含めてまとめる。
updates:
  # Root MCP server (npm).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
  # Landing site (site/) — its own pnpm project (pnpm-lock.yaml v9), merged in
  # with the monorepo and previously not covered by Dependabot.
  - package-ecosystem: 'npm'
    directory: '/site'
    schedule:
      interval: 'weekly'
    groups:
      site-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      site-dev-dependencies:
        dependency-type: 'development'
